<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Wind Trail Gradient -->
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="1" />
    </linearGradient>

    <!-- Sleek Body Metallic Gradient -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Speed Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" fill="#ffffff" rx="32" />

  <!-- Frame Circle Option -->
  

  <!-- Scaled Group for Car and Wind -->
  <g transform="translate(0, 0) scale(1)">
    
    <!-- Primary Flowing Wind Stream Lines (Background) -->
    <g class="wind-lines-bg">
      <!-- Main roof sweep line -->
      <path d="M 20 190 C 100 130, 200 110, 290 140 C 350 160, 410 210, 480 220" 
            fill="none" stroke="url(#windGrad)" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- Side aerodynamic body line -->
      <path d="M 10 260 C 90 230, 240 220, 370 250 C 420 260, 460 270, 495 270" 
            fill="none" stroke="#38bdf8" stroke-width="3.5999999999999996" stroke-linecap="round" opacity="0.85" />
      
      
          <!-- Upper wind line -->
          <path d="M 40 100 C 120 70, 220 75, 340 125 C 380 140, 420 155, 460 155" 
                fill="none" stroke="#38bdf8" stroke-width="2.4000000000000004" stroke-linecap="round" opacity="0.75" />
          <!-- Hood sweep -->
          <path d="M 300 185 C 340 180, 410 190, 450 205" 
                fill="none" stroke="#38bdf8" stroke-width="2.0999999999999996" stroke-dasharray="8 4" stroke-linecap="round" opacity="0.8" />
        
          <!-- Ground motion blur trails -->
          <path d="M 30 365 L 180 365" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
          <path d="M 210 365 L 310 365" fill="none" stroke="#38bdf8" stroke-width="3.5999999999999996" stroke-linecap="round" opacity="0.8" />
          <path d="M 340 365 L 470 365" fill="none" stroke="#38bdf8" stroke-width="2.7" stroke-linecap="round" opacity="0.5" />
          
          <!-- Top extreme wind surge -->
          <path d="M 120 70 C 200 50, 300 60, 400 110" 
                fill="none" stroke="#38bdf8" stroke-width="1.7999999999999998" stroke-linecap="round" opacity="0.5" />
        
    </g>

    <!-- Sleek Streamlined Car Silhouette -->
    <g class="car-silhouette">
      
      <!-- Ground Shadow / Speed Blur -->
      <ellipse cx="270" cy="355" rx="170" ry="12" fill="#1e293b" opacity="0.15" />

      <!-- Main Car Body Shell -->
      <path d="M 80 320 
               C 85 295, 110 280, 140 275
               C 170 240, 220 185, 290 180
               C 360 175, 410 225, 440 260
               C 460 280, 475 295, 470 320
               C 465 330, 440 335, 410 335
               L 110 335
               C 90 335, 78 330, 80 320 Z" 
            fill="#1e293b" />

      <!-- Cabin / Roof Contour Cutout (Darkened Window Profile) -->
      <path d="M 175 270 
               C 210 215, 270 192, 320 192
               C 365 192, 395 225, 415 260
               C 370 258, 280 255, 175 270 Z" 
            fill="#ffffff" opacity="0.9" />

      <!-- Inner Cabin Glass Overlay -->
      <path d="M 185 266 
               C 215 220, 268 200, 315 200
               C 355 200, 385 228, 402 258
               C 360 256, 280 253, 185 266 Z" 
            fill="#1e293b" opacity="0.25" />

      <!-- Aerodynamic Speed Accent Line (Body Side Swack) -->
      <path d="M 120 310 C 200 300, 340 285, 450 295" 
            fill="none" stroke="url(#accentGrad)" stroke-width="2.7" stroke-linecap="round" />

      <!-- Front Headlight Motion Flare -->
      <path d="M 445 285 C 465 285, 485 280, 500 275 C 485 290, 465 295, 445 295 Z" 
            fill="#38bdf8" opacity="0.9" />

      <!-- Rear Taillight Stream -->
      <path d="M 82 305 C 60 305, 30 310, 10 315 C 30 300, 60 295, 85 295 Z" 
            fill="#2563eb" opacity="0.8" />

      <!-- Rear Wheel Hub (Minimalist Aerodynamic Disk) -->
      <g transform="translate(150, 325)">
        <circle cx="0" cy="0" r="28" fill="#ffffff" />
        <circle cx="0" cy="0" r="24" fill="#1e293b" />
        <circle cx="0" cy="0" r="14" fill="#ffffff" />
        <circle cx="0" cy="0" r="10" fill="url(#accentGrad)" />
      </g>

      <!-- Front Wheel Hub (Minimalist Aerodynamic Disk) -->
      <g transform="translate(380, 325)">
        <circle cx="0" cy="0" r="28" fill="#ffffff" />
        <circle cx="0" cy="0" r="24" fill="#1e293b" />
        <circle cx="0" cy="0" r="14" fill="#ffffff" />
        <circle cx="0" cy="0" r="10" fill="url(#accentGrad)" />
      </g>

    </g>

    <!-- Foreground Wind Wraparound Lines (Over the car for depth) -->
    <g class="wind-lines-fg">
      <!-- Wind wrapping hood -->
      <path d="M 280 170 C 340 180, 390 220, 445 235 C 475 243, 495 240, 505 235" 
            fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.9" />
      
      <!-- Lower speed line cutting through wheels -->
      <path d="M 50 345 C 150 345, 300 345, 470 345" 
            fill="none" stroke="url(#windGrad)" stroke-width="2.4000000000000004" stroke-linecap="round" />
    </g>

  </g>

  <!-- Optional Brand Text -->
  
</svg>